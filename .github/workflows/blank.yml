name: Maven Create & Run

on:
  workflow_dispatch:   # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create or update Java file
        run: |
          mkdir -p src/main/java/com/example
          echo 'package com.example;

          public class Hello {
              public static void main(String[] args) {
                  System.out.println("Hello from GitHub Actions with Maven!");
              }
          }' > src/main/java/com/example/Hello.java

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add src/main/java/com/example/Hello.java
          git commit -m "Add/Update Hello.java" || echo "No changes to commit"
          git push

      - name: Run Maven package
        run: mvn clean package

      - name: Run Java class
        run: java -cp target/classes com.example.Hello
