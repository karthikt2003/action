name: Maven Build & Run Hii

on:
  workflow_dispatch:   # Trigger manually, or change to "push" if you want auto run on commit

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Commit & Push hii.java if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add hii.java
          git commit -m "Update hii.java from GitHub Actions" || echo "No changes to commit"
          git push

      - name: Build with Maven
        run: mvn clean package

      - name: Run hii.java
        run: java -cp target/classes Hii
